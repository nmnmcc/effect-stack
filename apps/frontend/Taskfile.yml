version: "3"

tasks:
  dev:
    desc: Start the Vite-powered React Router development server
    cmd: yarn dev

  build:
    desc: Generate the API client and build the React Router SSR application
    cmd: yarn build

  generate:
    desc: Generate the TanStack Query client from the Effect OpenAPI document
    cmd: yarn generate

  build:docker:
    desc: Build the frontend SSR image
    cmd: docker build -f ../../Dockerfile.frontend -t effect-stack/frontend ../..

  start:
    desc: Start the built React Router server
    cmd: yarn start

  lint:
    desc: Run ESLint
    cmd: yarn lint

  typecheck:
    desc: Generate route types and type-check the frontend
    cmd: yarn typecheck

  test:
    desc: Run frontend tests
    cmd: yarn test
