version: "3"

dotenv:
  - .env.local

vars:
  BIND_ADDRESS: '{{default "127.0.0.1" .BIND_ADDRESS}}'
  DATABASE_PORT: '{{default "5432" .DATABASE_PORT}}'
  POSTGRES_DATABASE: '{{default "effect_stack" .POSTGRES_DATABASE}}'
  POSTGRES_PASSWORD: '{{default "effect_stack" .POSTGRES_PASSWORD}}'
  POSTGRES_USER: '{{default "effect_stack" .POSTGRES_USER}}'
  REDIS_PORT: '{{default "6379" .REDIS_PORT}}'
  S3_ACCESS_KEY_ID: '{{default "effect-stack-dev" .S3_ACCESS_KEY_ID}}'
  S3_BUCKET: '{{default "effect-stack" .S3_BUCKET}}'
  S3_CONSOLE_PORT: '{{default "9001" .S3_CONSOLE_PORT}}'
  S3_PORT: '{{default "9000" .S3_PORT}}'
  S3_REGION: '{{default "us-east-1" .S3_REGION}}'
  S3_SECRET_ACCESS_KEY: '{{default "effect-stack-dev-secret" .S3_SECRET_ACCESS_KEY}}'

env:
  BIND_ADDRESS: "{{.BIND_ADDRESS}}"
  DATABASE_URL: "postgresql://{{.POSTGRES_USER}}:{{.POSTGRES_PASSWORD}}@{{.BIND_ADDRESS}}:{{.DATABASE_PORT}}/{{.POSTGRES_DATABASE}}"
  DATABASE_PORT: "{{.DATABASE_PORT}}"
  POSTGRES_DATABASE: "{{.POSTGRES_DATABASE}}"
  POSTGRES_PASSWORD: "{{.POSTGRES_PASSWORD}}"
  POSTGRES_USER: "{{.POSTGRES_USER}}"
  REDIS_PORT: "{{.REDIS_PORT}}"
  S3_ACCESS_KEY_ID: "{{.S3_ACCESS_KEY_ID}}"
  S3_BUCKET: "{{.S3_BUCKET}}"
  S3_CONSOLE_PORT: "{{.S3_CONSOLE_PORT}}"
  S3_ENDPOINT: "http://{{.BIND_ADDRESS}}:{{.S3_PORT}}"
  S3_PORT: "{{.S3_PORT}}"
  S3_REGION: "{{.S3_REGION}}"
  S3_SECRET_ACCESS_KEY: "{{.S3_SECRET_ACCESS_KEY}}"

includes:
  frontend:
    taskfile: "./apps/frontend/Taskfile.yml"
    dir: "./apps/frontend"
  backend:
    taskfile: "./apps/backend/Taskfile.yml"
    dir: "./apps/backend"

tasks:
  default:
    cmd: task --list-all

  dev:
    desc: Provision dependencies and start backend and React Router with hot reload
    cmds:
      - task: infra:up

      - task: dev:run

  dev:run:
    internal: true
    cmds:
      - task: backend:database:migrate
      - task --parallel backend:dev frontend:dev

  dev:stop:
    desc: Stop development containers without deleting data
    cmd: docker compose stop

  dev:status:
    desc: Show development infrastructure status
    cmds:
      - task: infra:status

  dev:logs:
    desc: "Follow a dependency log (usage: task dev:logs -- postgres|redis|rustfs)"
    cmd: docker compose logs --follow {{.CLI_ARGS}}

  dev:destroy:
    desc: Destroy development containers, network, and persistent data
    cmds:
      - task: infra:destroy

  dev:reset:
    desc: Destroy all data and restart
    cmds:
      - task: dev:destroy
      - task: dev

  infra:config:
    desc: Render and validate the Docker Compose configuration
    cmd: docker compose config

  infra:up:
    desc: Start local dependencies and initialize the S3 bucket
    cmds:
      - docker compose up --detach --wait --wait-timeout 60 postgres redis rustfs
      - docker compose run --rm rustfs-setup

  infra:status:
    desc: Show local dependency status
    cmd: docker compose ps --all

  infra:logs:
    desc: "Follow a dependency log (usage: task infra:logs -- postgres)"
    cmd: docker compose logs --follow {{.CLI_ARGS}}

  infra:destroy:
    desc: Delete development containers and persistent data
    prompt: This deletes all local dependency containers and persistent data. Continue?
    cmd: docker compose down --volumes --remove-orphans

  build:
    desc: Build all apps
    deps:
      - frontend:build
      - backend:build

  test:
    desc: Test all packages
    cmds:
      - yarn workspace @effect-stack/api test
      - yarn workspace @effect-stack/frontend test

  typecheck:
    desc: Type check all workspaces
    cmd: yarn tsc -b --noEmit

  lint:
    desc: Lint both apps
    deps:
      - frontend:lint
      - backend:lint

  format:
    desc: Format code with Prettier
    cmd: yarn prettier --write .

  format:check:
    desc: Check code formatting
    cmd: yarn prettier --check .
