name: effect-stack

services:
  postgres:
    image: postgres:17
    command: postgres -c wal_level=logical
    environment:
      POSTGRES_DB: ${POSTGRES_DATABASE:-effect_stack}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-effect_stack}
      POSTGRES_USER: ${POSTGRES_USER:-effect_stack}
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 2s
      timeout: 2s
      retries: 30
    ports:
      - ${BIND_ADDRESS:-127.0.0.1}:${DATABASE_PORT:-5432}:5432
    restart: unless-stopped
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 2s
      timeout: 2s
      retries: 30
    ports:
      - ${BIND_ADDRESS:-127.0.0.1}:${REDIS_PORT:-6379}:6379
    restart: unless-stopped

  rustfs:
    image: rustfs/rustfs:latest
    command: server /data --console-address :9001
    environment:
      RUSTFS_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:-effect-stack-dev-secret}
      RUSTFS_ROOT_USER: ${S3_ACCESS_KEY_ID:-effect-stack-dev}
    ports:
      - ${BIND_ADDRESS:-127.0.0.1}:${S3_PORT:-9000}:9000
      - ${BIND_ADDRESS:-127.0.0.1}:${S3_CONSOLE_PORT:-9001}:9001
    restart: unless-stopped
    volumes:
      - rustfs-data:/data

  rustfs-setup:
    image: minio/mc:latest
    depends_on:
      rustfs:
        condition: service_started
    environment:
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-effect-stack-dev}
      S3_BUCKET: ${S3_BUCKET:-effect-stack}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-effect-stack-dev-secret}
    entrypoint: /bin/sh
    command:
      - -c
      - |
        attempt=0
        until mc alias set local http://rustfs:9000 "$${S3_ACCESS_KEY_ID}" "$${S3_SECRET_ACCESS_KEY}" && mc mb --ignore-existing "local/$${S3_BUCKET}"; do
          attempt=$$((attempt + 1))
          if [ "$$attempt" -ge 30 ]; then
            exit 1
          fi
          sleep 2
        done
    restart: "no"

volumes:
  postgres-data:
  rustfs-data:
